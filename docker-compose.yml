# 로컬 개발용: 지금은 MySQL(db)만 띄운다.
#   docker compose up -d db
# api, worker, nginx 서비스는 8주차(배포)에 추가한다. (설계 레퍼런스 14장)
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fairpick
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    # 한글·이모지 저장 (레퍼런스 6장 설계 원칙)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 개발 중 호스트의 uvicorn 에서 접속하려고 연다. 운영에서는 닫는다.
      - "${DB_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # 처음 만들 때만 실행: 테스트 DB(fairpick_test) 생성과 권한 부여
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  # 개발용 메일 확인 도구. 실제로 보내지 않고 http://localhost:8025 에서 본다
  #   docker compose --profile mail up -d mailpit
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
