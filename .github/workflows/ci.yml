# push 와 PR 마다 백엔드 테스트·린트와 프론트 린트·빌드를 실행한다 (레퍼런스 13장 코드 품질 도구)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Actions 탭에서 직접 실행

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fairpick_test
          MYSQL_USER: fairpick
          MYSQL_PASSWORD: fairpick
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://fairpick:fairpick@127.0.0.1:3306/fairpick_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://fairpick:fairpick@127.0.0.1:3306/fairpick_test?charset=utf8mb4
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
