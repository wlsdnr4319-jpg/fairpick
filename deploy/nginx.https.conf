# 인증 API 요청 수 제한: IP 당 분당 30회, 순간 20회까지 허용 (레퍼런스 10장 보안).
# 앱의 로그인 횟수 제한(app/services/login_guard.py)보다 앞에서 대량 요청을 거른다.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

# HTTPS 설정. 인증서를 발급한 뒤 docker-compose.prod.yml 의 nginx volumes 에서 이 파일을 default.conf 로 마운트한다.
# example.com 을 실제 도메인으로 바꾼다.
server {
    listen 80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 1m;

    # 로그인·가입·재발급 등. 한도를 넘으면 앱과 같은 JSON 에러 형식으로 429
    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_requests;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":{"code":"TOO_MANY_REQUESTS","message":"요청이 너무 많아요. 잠시 후 다시 시도해 주세요"}}';
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Nginx 가 맨 앞단이므로 클라이언트가 보낸 X-Forwarded-For 는 버리고 실제 접속 IP 로 덮어쓴다
        # (덧붙이면 uvicorn 이 조작된 맨 앞 값을 IP 로 써서 IP 기준 제한을 피할 수 있다)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # location 안에서 add_header 를 쓰면 server 단의 보안 헤더가 빠진다. 캐시는 expires 로만 정한다
    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
