# HTTP(80). HTTPS 는 서버에서 certbot 이 이 설정에 443 블록을 추가한다 (docs/deploy.md).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1m;

    # Let's Encrypt 인증서 발급용 (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 빌드 파일은 이름에 해시가 붙어 오래 캐시해도 된다
    # location 안에서 add_header 를 쓰면 server 단의 보안 헤더가 빠진다. 캐시는 expires 로만 정한다
    location /assets/ {
        expires 1y;
    }

    # /fairs/12 에서 새로고침하면 서버에는 그런 파일이 없어 404 가 난다.
    # 없는 경로를 index.html 로 돌려주면 React Router 가 화면을 그린다 (레퍼런스 14장)
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
